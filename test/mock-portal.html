<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CityMart Mock Portal - Workflow Capture Test</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      max-width: 800px;
      margin: 40px auto;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      background: #ffffff;
    }
    h1 { color: #1e293b; margin-top: 0; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; }
    input[type="text"], input[type="password"], select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }
    .btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.15s;
    }
    .btn:hover { background: #1d4ed8; }
    .btn-secondary { background: #64748b; }
    .btn-secondary:hover { background: #475569; }
    .alert-success {
      background: #dcfce7;
      color: #166534;
      padding: 12px;
      border-radius: 6px;
      margin-top: 20px;
      display: none;
    }
    .dynamic-box {
      margin-top: 20px;
      padding: 16px;
      background: #f1f5f9;
      border-radius: 8px;
      border-left: 4px solid #3b82f6;
    }
    #delayed-container {
      margin-top: 15px;
      display: none;
    }
  </style>
</head>
<body>

  <h1>CityMart Automation Test Portal</h1>
  <p style="color: #64748b;">Used for verifying recorder candidate generation, input batching, and condition-based replay.</p>

  <form id="order-form" onsubmit="event.preventDefault(); handleSubmit();">
    <div class="form-group">
      <label for="product-query">Search Product</label>
      <input type="text" id="product-query" data-testid="search-input" placeholder="e.g. Wireless Mouse" />
    </div>

    <div class="form-group">
      <label for="category-dropdown">Department Category</label>
      <select id="category-dropdown" name="category" data-qa="category-select">
        <option value="">-- Choose Category --</option>
        <option value="electronics">Electronics & Gadgets</option>
        <option value="office">Office Supplies</option>
        <option value="apparel">Clothing & Apparel</option>
      </select>
    </div>

    <div class="form-group">
      <label for="user-password">Security PIN / Password (Must Redact)</label>
      <input type="password" id="user-password" placeholder="Enter secure secret" />
    </div>

    <div class="dynamic-box">
      <h3>Dynamic Flow Simulation</h3>
      <p style="font-size: 13px; color: #475569;">Clicking below spawns a delayed confirmation button after 1200ms.</p>
      <button type="button" id="trigger-delayed-btn" class="btn btn-secondary" onclick="triggerDelayedElement()">
        Load Async Action
      </button>

      <div id="delayed-container">
        <p>Async element ready!</p>
        <button type="button" id="confirm-delayed-btn" data-testid="confirm-async-action" class="btn" onclick="handleAsyncConfirmed()">
          Confirm Async Operation
        </button>
      </div>
    </div>

    <div style="margin-top: 24px;">
      <button type="submit" id="submit-order-btn" class="btn">
        Submit Order
      </button>
    </div>
  </form>

  <div id="status-banner" class="alert-success">
    <strong id="status-title">Order Submitted!</strong>
    <div id="status-details"></div>
  </div>

  <script>
    function triggerDelayedElement() {
      const btn = document.getElementById('trigger-delayed-btn');
      btn.textContent = 'Loading...';
      btn.disabled = true;

      setTimeout(() => {
        document.getElementById('delayed-container').style.display = 'block';
        btn.textContent = 'Loaded!';
      }, 1200);
    }

    function handleAsyncConfirmed() {
      alert('Async Action Confirmed!');
    }

    function handleSubmit() {
      const product = document.getElementById('product-query').value;
      const cat = document.getElementById('category-dropdown').value;
      const banner = document.getElementById('status-banner');
      const details = document.getElementById('status-details');

      details.textContent = `Product: "${product}", Category: "${cat}", Timestamp: ${new Date().toLocaleTimeString()}`;
      banner.style.display = 'block';
    }
  </script>
</body>
</html>
