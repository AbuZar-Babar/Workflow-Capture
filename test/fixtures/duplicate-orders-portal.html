<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Orders Portal — Duplicate Handling Fixture</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 32px; }
    .container { max-width: 800px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 8px; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { padding: 10px; border-bottom: 1px solid #334155; text-align: left; }
    th { background: #0f172a; color: #94a3b8; }
    .btn-download { background: #3b82f6; color: white; padding: 4px 8px; border-radius: 4px; text-decoration: none; font-size: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Orders Portal (Duplicate Identity Testing)</h1>
    <table id="orders-table">

          <th>Amount</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <!-- Row 1: ORD-9001 -->
        <tr data-id="ORD-9001">

          <td class="col-cust" data-field="Customer">Customer Alpha</td>
          <td class="col-amount" data-field="Amount"><span class="badge">$500.00</span></td>
          <td class="col-action">
            <a class="btn-download" download="ORD-9001.txt" href="data:text/plain;charset=utf-8,Order%20ORD-9001%20Alpha">Download</a>
          </td>
        </tr>
        <!-- Row 2: ORD-9002 -->

          </td>
        </tr>
        <!-- Row 3: Duplicate of Row 1 (ORD-9001) -->
        <tr data-id="ORD-9001">
          <td class="col-id" data-field="OrderID">ORD-9001</td>
          <td class="col-cust" data-field="Customer">Customer Alpha Duplicate</td>
          <td class="col-amount" data-field="Amount"><span class="badge">$500.00</span></td>

            <a class="btn-download" download="ORD-9001.txt" href="data:text/plain;charset=utf-8,Order%20ORD-9001%20Alpha">Download</a>

    </table>

</html>
