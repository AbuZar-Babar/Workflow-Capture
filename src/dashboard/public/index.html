<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workflow Capture — Visual Automation Dashboard</title>
  
  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Modular Stylesheets -->
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/views.css">
  
  <!-- Drawflow for Node-based Editor -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jerosoler/Drawflow/dist/drawflow.min.css">
  <script src="https://cdn.jsdelivr.net/gh/jerosoler/Drawflow/dist/drawflow.min.js"></script>
  
  <style>
    /* ===================================================================
       Drawflow Quixotic Premium Theme (n8n / Modern Visual Editor Style)
       =================================================================== */

    /* Full Canvas Background on Viewport & View Container */
    .workflow-editor-canvas,
    .parent-drawflow {
      background-color: #f8fafc !important;
      background-size: 24px 24px !important;
      background-image: radial-gradient(circle, rgba(12, 92, 63, 0.12) 1.2px, transparent 1.2px) !important;
    }

    .drawflow {
      background: transparent !important;
      background-image: none !important;
      height: 100% !important;
      width: 100% !important;
    }

    /* Base Node Card Styling */
    .drawflow .drawflow-node {
      display: flex !important;
      flex-direction: column !important;
      background: #ffffff !important;
      color: var(--text-main) !important;
      border: 1px solid rgba(0, 0, 0, 0.09) !important;
      border-radius: 14px !important;
      min-width: 280px !important;
      max-width: 320px !important;
      width: auto !important;
      min-height: auto !important;
      padding: 0 !important;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.06), 0 4px 10px -2px rgba(0, 0, 0, 0.03) !important;
      transition: box-shadow 0.2s ease, border-color 0.2s ease, transform 0.15s ease !important;
      overflow: visible !important;
      font-family: var(--font-sans) !important;
    }

    .drawflow .drawflow-node:hover {
      border-color: var(--brand-emerald) !important;
      box-shadow: 0 16px 32px -8px rgba(12, 92, 63, 0.15), 0 6px 14px -3px rgba(0, 0, 0, 0.04) !important;
    }

    .drawflow .drawflow-node.selected {
      border: 2px solid var(--brand-forest) !important;
      box-shadow: 0 0 0 4px rgba(12, 92, 63, 0.12), 0 16px 32px -8px rgba(0, 0, 0, 0.1) !important;
    }

    /* Inner content wrapper */
    .drawflow .drawflow-node .drawflow_content_node {
      width: 100% !important;
      display: block !important;
    }

    /* Node Header */
    .df-node-header {
      display: flex !important;
      justify-content: space-between !important;
      align-items: center !important;
      padding: 10px 14px !important;
      background: #f8faf9 !important;
      border-bottom: 1px solid rgba(0, 0, 0, 0.06) !important;
      border-top-left-radius: 13px !important;
      border-top-right-radius: 13px !important;
    }

    .df-action-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 800;
      font-size: 0.78rem;
      letter-spacing: 0.03em;
      padding: 4px 9px;
      border-radius: 7px;
    }

    .df-action-badge.click {
      background: #e6f4ea;
      color: #137333;
    }

    .df-action-badge.type {
      background: #e8f0fe;
      color: #1a73e8;
    }

    .df-action-badge.navigate {
      background: #fef7e0;
      color: #b06000;
    }

    .df-action-badge.select {
      background: #f0fdf4;
      color: #15803d;
    }

    .df-action-badge.key_press,
    .df-action-badge.press_key,
    .df-action-badge.enter {
      background: #f3e8ff;
      color: #7e22ce;
    }

    .df-step-number {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-sub);
      background: rgba(0, 0, 0, 0.04);
      padding: 3px 8px;
      border-radius: 999px;
    }

    /* Node Body */
    .df-node-body {
      padding: 14px !important;
      display: flex !important;
      flex-direction: column !important;
      gap: 11px !important;
      background: #ffffff !important;
      border-bottom-left-radius: 13px !important;
      border-bottom-right-radius: 13px !important;
    }

    .df-input-group {
      display: flex !important;
      flex-direction: column !important;
      gap: 5px !important;
    }

    .df-input-group label {
      font-size: 0.7rem !important;
      font-weight: 700 !important;
      text-transform: uppercase !important;
      letter-spacing: 0.04em !important;
      color: var(--text-sub) !important;
    }

    .df-input-group input,
    .df-input-group select {
      padding: 8px 11px !important;
      border: 1px solid rgba(0, 0, 0, 0.12) !important;
      border-radius: 8px !important;
      font-family: var(--font-mono) !important;
      font-size: 0.78rem !important;
      background: #fafafa !important;
      color: var(--text-main) !important;
      transition: all 0.2s ease !important;
      width: 100% !important;
      box-sizing: border-box !important;
    }

    .df-input-group input:focus,
    .df-input-group select:focus {
      border-color: var(--brand-forest) !important;
      box-shadow: 0 0 0 3px rgba(12, 92, 63, 0.12) !important;
      outline: none !important;
      background: #ffffff !important;
    }

    .df-badge-pill {
      font-size: 0.68rem;
      padding: 3px 7px;
      border-radius: 6px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .df-badge-pill.loop {
      background: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    .df-badge-pill.options {
      background: #eff6ff;
      color: #1e40af;
      border: 1px solid #bfdbfe;
    }

    /* Input & Output Ports (Connectors) */
    .drawflow .drawflow-node .inputs,
    .drawflow .drawflow-node .outputs {
      position: absolute !important;
      top: 50% !important;
      transform: translateY(-50%) !important;
      height: 0 !important;
      width: 0 !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      z-index: 10 !important;
    }

    .drawflow .drawflow-node .inputs {
      left: 0 !important;
    }

    .drawflow .drawflow-node .outputs {
      right: 0 !important;
    }

    .drawflow .drawflow-node .input,
    .drawflow .drawflow-node .output {
      width: 16px !important;
      height: 16px !important;
      background: #ffffff !important;
      border: 2.5px solid var(--brand-forest) !important;
      border-radius: 50% !important;
      cursor: crosshair !important;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12) !important;
      transition: all 0.2s ease !important;
    }

    .drawflow .drawflow-node .input {
      left: -9px !important;
      position: absolute !important;
    }

    .drawflow .drawflow-node .output {
      right: -9px !important;
      position: absolute !important;
    }

    .drawflow .drawflow-node .input:hover,
    .drawflow .drawflow-node .output:hover {
      background: var(--brand-forest) !important;
      transform: scale(1.3) !important;
      border-color: #ffffff !important;
    }

    /* Connection Lines (Cables) */
    .drawflow .connection .main-path {
      stroke-width: 3.5px !important;
      stroke: var(--brand-forest) !important;
      stroke-linecap: round !important;
      filter: drop-shadow(0 2px 4px rgba(12, 92, 63, 0.15)) !important;
    }

    .drawflow .connection .main-path:hover {
      stroke: var(--brand-accent) !important;
      stroke-width: 4.5px !important;
    }

    .drawflow .connection .main-path.selected {
      stroke: var(--brand-accent) !important;
      stroke-width: 4.5px !important;
    }

    /* Delete Connection Button */
    .drawflow .drawflow-delete {
      background: #ef4444 !important;
      color: #ffffff !important;
      border: 2px solid #ffffff !important;
      box-shadow: 0 4px 10px rgba(239, 68, 68, 0.3) !important;
      border-radius: 50% !important;
      width: 24px !important;
      height: 24px !important;
      line-height: 20px !important;
      font-size: 13px !important;
      font-weight: bold !important;
      cursor: pointer !important;
      transition: transform 0.2s ease !important;
      text-align: center !important;
      display: block !important;
    }

    .drawflow .drawflow-delete:hover {
      transform: scale(1.15) !important;
    }

    /* View layout */
    .workflow-editor-layout {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 600px;
      width: 100%;
      position: relative;
      background: var(--bg-surface);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-card);
      overflow: hidden;
    }
    
    .workflow-editor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.9rem 1.5rem;
      background: #ffffff;
      border-bottom: 1px solid rgba(0, 0, 0, 0.07);
      z-index: 10;
      flex-shrink: 0;
    }
    
    .workflow-editor-canvas,
    #drawflow,
    .parent-drawflow {
      flex: 1 1 0% !important;
      width: 100% !important;
      height: 100% !important;
      min-height: 0 !important;
      position: relative !important;
      overflow: hidden !important;
      touch-action: none !important;
      cursor: grab !important;
      user-select: none !important;
    }

    .workflow-editor-canvas:active,
    .parent-drawflow:active {
      cursor: grabbing !important;
    }

    /* Inner transform container */
    .drawflow {
      width: 100% !important;
      height: 100% !important;
      min-width: 100% !important;
      min-height: 100% !important;
      position: relative !important;
      background: transparent !important;
      background-image: none !important;
      user-select: none !important;
    }

    .drawflow-canvas-controls {
      position: absolute;
      bottom: 1.25rem;
      right: 1.25rem;
      display: flex;
      gap: 0.35rem;
      background: #ffffff;
      padding: 0.35rem;
      border-radius: var(--radius-md);
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      z-index: 15;
    }

    .drawflow-canvas-controls button {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8faf9;
      border: 1px solid rgba(0, 0, 0, 0.06);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .drawflow-canvas-controls button:hover {
      background: var(--brand-forest);
      color: #ffffff;
      border-color: var(--brand-forest);
    }
  </style>
</head>
<body>

  <!-- Main Quixotic Dashboard Shell Container -->
  <main class="dashboard-wrapper">

    <!-- Main Body Layout with Floating Left Sidebar -->
    <div class="dashboard-body">

      <!-- Floating Left Icon Sidebar -->
      <aside class="floating-sidebar">
        <div style="display:flex; flex-direction:column; align-items:center; gap:1.25rem; width:100%;">
          <!-- Brand Logo Icon -->
          <button class="sidebar-active-btn" title="Overview Dashboard" onclick="location.hash='#overview'">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/>
            </svg>
          </button>
          
          <nav class="sidebar-nav-icons">
            <button class="sidebar-icon-btn active" data-route="overview" title="Overview Dashboard">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
              </svg>
            </button>
            <button class="sidebar-icon-btn" data-route="workflows" title="Recorded Workflows Archive">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
              </svg>
            </button>
            <button class="sidebar-icon-btn" data-route="console" title="Live Streaming Console">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
              </svg>
            </button>
            <button class="sidebar-icon-btn" data-route="secrets" title="Credential Vault">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
              </svg>
            </button>
            <button class="sidebar-icon-btn" data-route="artifacts" title="Extracted Artifacts & Scraped Data">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
              </svg>
            </button>
            <button class="sidebar-icon-btn" data-route="bot-config" title="Bot Profile & Anti-Captcha Stealth">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"/>
              </svg>
            </button>
          </nav>
        </div>

        <div style="display:flex; flex-direction:column; align-items:center; gap:0.75rem;">
          <button class="sidebar-icon-btn" id="btnSidebarStopExecution" title="Emergency Stop Execution" style="color:#ef4444; background:rgba(239,68,68,0.12); border:1px solid rgba(239,68,68,0.3); display:none;">
            <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
              <rect x="5" y="5" width="14" height="14" rx="2"/>
            </svg>
          </button>
          <button class="sidebar-icon-btn" id="btnSidebarLaunchChrome" title="Launch Chrome & Debug (CDP Port 9222)" style="color:var(--brand-forest);">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.59 14.37a6 6 0 01-5.84 7.38v-1.8a4 4 0 002.5-3.66m-7.07-5.05a6 6 0 017.38-5.84h1.8a4 4 0 00-3.66 2.5m1.34-3.14l4.24-4.24a1 1 0 011.42 0l1.41 1.41a1 1 0 010 1.42l-4.24 4.24m-2.83 2.83l-2.12 2.12a1 1 0 01-1.42 0l-1.41-1.41a1 1 0 010-1.42l2.12-2.12"/>
            </svg>
          </button>
          <button class="sidebar-icon-btn" title="Reload Dashboard" onclick="location.reload()">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
            </svg>
          </button>
          <button class="sidebar-icon-btn" id="btnLogout" title="Logout" style="color:var(--text-tertiary); margin-top:0.5rem;">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
            </svg>
          </button>
        </div>
      </aside>
      <!-- END: Floating Left Sidebar -->

      <!-- Dynamic SPA View Mount Point -->
      <section class="app-view-container" id="appViewContainer">
        <!-- Tab views render dynamically here -->
      </section>

    </div>
    <!-- END: Main Body Layout -->

  </main>
  <!-- END: Main Dashboard Container -->

  <!-- BEGIN: Step Inspector Modal -->
  <div class="modal-overlay hidden" id="stepInspectorModal">
    <div class="modal-dialog">
      <div class="modal-header">
        <div style="display:flex; align-items:center; gap:0.5rem;">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
          <h3 id="modalWorkflowTitle">Workflow Step Inspector</h3>
        </div>
        <button class="btn-icon" id="btnCloseModal" title="Close Modal">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="modal-body">
        <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:0.75rem; background:#f9fafb; padding:0.85rem; border-radius:var(--radius-md); border:1px solid rgba(0,0,0,0.06);" id="modalMetaGrid"></div>
        <h4 style="font-size:0.85rem; font-weight:800; margin-top:0.5rem;">Recorded Action Fingerprints</h4>
        <div style="display:flex; flex-direction:column; gap:0.75rem;" id="modalStepsTimeline"></div>
      </div>
    </div>
  </div>
  <!-- END: Step Inspector Modal -->

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- BEGIN: Auth Overlay (hidden if authenticated) -->
  <div class="modal-overlay hidden" id="authOverlay" style="display:none !important; background:#ffffff; z-index: 10000; align-items: center;">
    <div style="background: white; padding: 2.5rem; border-radius: var(--radius-lg); border: 1px solid var(--border-light); box-shadow: 0 10px 30px rgba(0,0,0,0.05); width: 100%; max-width: 400px;">
      <div style="text-align:center; margin-bottom: 2rem;">
        <div style="display:inline-flex; align-items:center; justify-content:center; width:56px; height:56px; background:var(--brand-tint); color:var(--brand-forest); border-radius:var(--radius-lg); margin-bottom:1rem;">
          <svg width="32" height="32" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/>
          </svg>
        </div>
        <h2 style="font-size:1.5rem; margin-bottom:0.5rem; color:var(--text-primary);">Workflow Capture</h2>
        <p style="color:var(--text-secondary); font-size:0.9rem;" id="authSubtitle">Log in to your account</p>
      </div>
      
      <form id="authForm" style="display:flex; flex-direction:column; gap:1.25rem;">
        <div id="usernameGroup" style="display:none; flex-direction:column; gap:0.5rem;">
          <label style="font-size:0.85rem; font-weight:600; color:var(--text-secondary);">Username</label>
          <input type="text" id="authUsername" placeholder="e.g. jdoe" style="padding:0.75rem; border:1px solid var(--border-light); border-radius:var(--radius-sm); outline:none; font-family:inherit;">
        </div>
        <div style="display:flex; flex-direction:column; gap:0.5rem;">
          <label style="font-size:0.85rem; font-weight:600; color:var(--text-secondary);">Email</label>
          <input type="email" id="authEmail" placeholder="name@example.com" style="padding:0.75rem; border:1px solid var(--border-light); border-radius:var(--radius-sm); outline:none; font-family:inherit;">
        </div>
        <div style="display:flex; flex-direction:column; gap:0.5rem;">
          <label style="font-size:0.85rem; font-weight:600; color:var(--text-secondary);">Password</label>
          <input type="password" id="authPassword" placeholder="••••••••" style="padding:0.75rem; border:1px solid var(--border-light); border-radius:var(--radius-sm); outline:none; font-family:inherit;">
        </div>
        <button type="submit" style="background:var(--brand-accent); color:white; border:none; border-radius:var(--radius-md); padding:0.85rem; font-weight:600; cursor:pointer; margin-top:0.5rem; transition: background 0.2s;" onmouseover="this.style.background='var(--brand-accent-hover)'" onmouseout="this.style.background='var(--brand-accent)'" id="authSubmitBtn">Log In</button>
        <button type="button" id="btnDummyLogin" onclick="window.quickEnterDashboard ? window.quickEnterDashboard() : null" style="background:#0c5c3f; color:#ffffff; border:none; border-radius:var(--radius-md); padding:0.85rem; font-weight:700; cursor:pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 0.5rem; box-shadow: 0 4px 12px rgba(12, 92, 63, 0.2);" onmouseover="this.style.background='#08442e'" onmouseout="this.style.background='#0c5c3f'">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
          <span>Enter Dashboard (Skip Login)</span>
        </button>
      </form>
      
      <div style="text-align:center; margin-top:1.5rem; font-size:0.85rem; color:var(--text-secondary);">
