<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workflow Capture — Visual Automation Dashboard</title>
  
  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Modular Stylesheets -->
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/views.css">
  
  <!-- Drawflow for Node-based Editor -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jerosoler/Drawflow/dist/drawflow.min.css">
  <script src="https://cdn.jsdelivr.net/gh/jerosoler/Drawflow/dist/drawflow.min.js"></script>
  
  <style>
    /* Drawflow Quixotic Theme Overrides */
    :root {
      --dfBackgroundColor: var(--bg-body);
      --dfBackgroundSize: 20px;
      --dfBackgroundImage: linear-gradient(to right, var(--border-light) 1px, transparent 1px), linear-gradient(to bottom, var(--border-light) 1px, transparent 1px);
      --dfNodeType: flex;
      --dfNodeTypeColumn: column;
      --dfNodeBackgroundColor: var(--bg-surface);
      --dfNodeTextColor: var(--text-main);
      --dfNodeBorderSize: 1px;
      --dfNodeBorderColor: var(--border-light);
      --dfNodeBorderRadius: var(--radius-md);
      --dfNodeMinHeight: 40px;
      --dfNodeMinWidth: 260px;
      --dfNodePaddingTop: 15px;
      --dfNodePaddingBottom: 15px;
      --dfNodeBoxShadowHL: 0 4px 12px rgba(0, 0, 0, 0.05);
      --dfNodeHoverBackgroundColor: var(--bg-surface);
      --dfNodeHoverTextColor: var(--text-main);
      --dfNodeHoverBorderSize: 1px;
      --dfNodeHoverBorderColor: var(--brand-accent);
      --dfNodeHoverBorderRadius: var(--radius-md);
      --dfNodeHoverBoxShadowHL: 0 4px 12px rgba(0, 0, 0, 0.1);
      --dfNodeSelectedBackgroundColor: var(--bg-surface);
      --dfNodeSelectedTextColor: var(--text-main);
      --dfNodeSelectedBorderSize: 2px;
      --dfNodeSelectedBorderColor: var(--brand-accent);
      --dfNodeSelectedBorderRadius: var(--radius-md);
      --dfNodeSelectedBoxShadowHL: 0 4px 12px rgba(0, 0, 0, 0.15);
      --dfInputBackgroundColor: var(--bg-body);
      --dfInputBorderSize: 1px;
      --dfInputBorderColor: var(--border-light);
      --dfInputBorderRadius: 50%;
      --dfInputLeft: -10px;
      --dfInputHeight: 16px;
      --dfInputWidth: 16px;
      --dfInputHoverBackgroundColor: var(--bg-body);
      --dfInputHoverBorderSize: 1px;
      --dfInputHoverBorderColor: var(--brand-accent);
      --dfInputHoverBorderRadius: 50%;
      --dfOutputBackgroundColor: var(--bg-body);
      --dfOutputBorderSize: 1px;
      --dfOutputBorderColor: var(--border-light);
      --dfOutputBorderRadius: 50%;
      --dfOutputRight: -10px;
      --dfOutputHeight: 16px;
      --dfOutputWidth: 16px;
      --dfOutputHoverBackgroundColor: var(--bg-body);
      --dfOutputHoverBorderSize: 1px;
      --dfOutputHoverBorderColor: var(--brand-accent);
      --dfOutputHoverBorderRadius: 50%;
      --dfLineWidth: 3px;
      --dfLineColor: var(--brand-primary);
      --dfLineHoverColor: var(--brand-accent);
      --dfLineSelectedColor: var(--brand-accent);
      --dfRerouteBorderWidth: 1px;
      --dfRerouteBorderColor: var(--border-light);
      --dfRerouteBackgroundColor: var(--bg-body);
      --dfRerouteHoverBorderWidth: 1px;
      --dfRerouteHoverBorderColor: var(--brand-accent);
      --dfRerouteHoverBackgroundColor: var(--bg-body);
      --dfDeleteDisplay: block;
      --dfDeleteColor: white;
      --dfDeleteBackgroundColor: var(--brand-danger);
      --dfDeleteBorderSize: 0px;
      --dfDeleteBorderColor: transparent;
      --dfDeleteBorderRadius: 50%;
      --dfDeleteTop: -10px;
      --dfDeleteRight: -10px;
    }
    
    .drawflow {
      background: var(--dfBackgroundColor);
      background-size: var(--dfBackgroundSize) var(--dfBackgroundSize);
      background-image: var(--dfBackgroundImage);
      height: 100%;
      width: 100%;
    }
    
    .drawflow-node {
      display: var(--dfNodeType);
      flex-direction: var(--dfNodeTypeColumn);
      background: var(--dfNodeBackgroundColor);
      color: var(--dfNodeTextColor);
      border: var(--dfNodeBorderSize) solid var(--dfNodeBorderColor);
      border-radius: var(--dfNodeBorderRadius);
      min-height: var(--dfNodeMinHeight);
      width: auto;
      min-width: var(--dfNodeMinWidth);
      padding-top: var(--dfNodePaddingTop);
      padding-bottom: var(--dfNodePaddingBottom);
      box-shadow: var(--dfNodeBoxShadowHL);
    }
    
    .drawflow-node:hover {
      background: var(--dfNodeHoverBackgroundColor);
      color: var(--dfNodeHoverTextColor);
      border: var(--dfNodeHoverBorderSize) solid var(--dfNodeHoverBorderColor);
      border-radius: var(--dfNodeHoverBorderRadius);
      box-shadow: var(--dfNodeHoverBoxShadowHL);
    }
    
    .drawflow-node.selected {
      background: var(--dfNodeSelectedBackgroundColor);
      color: var(--dfNodeSelectedTextColor);
      border: var(--dfNodeSelectedBorderSize) solid var(--dfNodeSelectedBorderColor);
      border-radius: var(--dfNodeSelectedBorderRadius);
      box-shadow: var(--dfNodeSelectedBoxShadowHL);
    }

    .drawflow-node .inputs .input {
      background: var(--dfInputBackgroundColor);
      border: var(--dfInputBorderSize) solid var(--dfInputBorderColor);
      border-radius: var(--dfInputBorderRadius);
      left: var(--dfInputLeft);
      height: var(--dfInputHeight);
      width: var(--dfInputWidth);
    }
    
    .drawflow-node .inputs .input:hover {
      background: var(--dfInputHoverBackgroundColor);
      border: var(--dfInputHoverBorderSize) solid var(--dfInputHoverBorderColor);
      border-radius: var(--dfInputHoverBorderRadius);
    }

    .drawflow-node .outputs .output {
      background: var(--dfOutputBackgroundColor);
      border: var(--dfOutputBorderSize) solid var(--dfOutputBorderColor);
      border-radius: var(--dfOutputBorderRadius);
      right: var(--dfOutputRight);
      height: var(--dfOutputHeight);
      width: var(--dfOutputWidth);
    }
    
    .drawflow-node .outputs .output:hover {
      background: var(--dfOutputHoverBackgroundColor);
      border: var(--dfOutputHoverBorderSize) solid var(--dfOutputHoverBorderColor);
      border-radius: var(--dfOutputHoverBorderRadius);
    }

    .drawflow .connection .main-path {
      stroke-width: var(--dfLineWidth);
      stroke: var(--dfLineColor);
    }

    .drawflow .connection .main-path:hover {
      stroke: var(--dfLineHoverColor);
    }

    .drawflow .connection .main-path.selected {
      stroke: var(--dfLineSelectedColor);
    }
    
    .drawflow .drawflow-delete {
      display: var(--dfDeleteDisplay);
      color: var(--dfDeleteColor);
      background: var(--dfDeleteBackgroundColor);
      border: var(--dfDeleteBorderSize) solid var(--dfDeleteBorderColor);
      border-radius: var(--dfDeleteBorderRadius);
      top: var(--dfDeleteTop);
      right: var(--dfDeleteRight);
      font-size: 14px;
      line-height: 20px;
      width: 22px;
      height: 22px;
      text-align: center;
      cursor: pointer;
    }
    
    /* Custom inner styles for our nodes */
    .df-node-header {
      font-weight: 700;
      font-size: 0.95rem;
      border-bottom: 1px solid var(--border-light);
      padding-bottom: 8px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .df-node-body {
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 0.85rem;
    }
    .df-input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .df-input-group label {
      font-weight: 600;
      color: var(--text-sub);
      font-size: 0.75rem;
    }
    .df-input-group input, .df-input-group select {
      padding: 6px 8px;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.85rem;
    }
    
    /* View layout */
    .workflow-editor-layout {
      display: flex;
      flex-direction: column;
      height: 100vh; /* Takes full height of container */
      position: relative;
    }
    
    .workflow-editor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.5rem;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-light);
      z-index: 10;
    }
    
    .workflow-editor-canvas {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
  </style>
</head>
<body>

  <!-- Main Quixotic Dashboard Shell Container -->
  <main class="dashboard-wrapper">

    <!-- Main Body Layout with Floating Left Sidebar -->
    <div class="dashboard-body">

      <!-- Floating Left Icon Sidebar -->
      <aside class="floating-sidebar">
        <div style="display:flex; flex-direction:column; align-items:center; gap:1.25rem; width:100%;">
          <!-- Brand Logo Icon -->
          <button class="sidebar-active-btn" title="Overview Dashboard" onclick="location.hash='#overview'">
            <span style="font-size:1.1rem; line-height:1;">⚡</span>
          </button>
          
          <nav class="sidebar-nav-icons">
            <button class="sidebar-icon-btn active" data-route="overview" title="Overview Dashboard">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
              </svg>
            </button>
            <button class="sidebar-icon-btn" data-route="workflows" title="Recorded Workflows Archive">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
              </svg>
            </button>
            <button class="sidebar-icon-btn" data-route="console" title="Live Streaming Console">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
              </svg>
            </button>
            <button class="sidebar-icon-btn" data-route="portals" title="Test Environments">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="2" y1="12" x2="22" y2="12"></line>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
              </svg>
            </button>
            <button class="sidebar-icon-btn" data-route="tests" title="Diagnostics & Test Suite">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/>
              </svg>
            </button>
            <button class="sidebar-icon-btn" data-route="secrets" title="Credential Vault">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
              </svg>
            </button>
          </nav>
        </div>

        <div style="display:flex; flex-direction:column; align-items:center; gap:0.75rem;">
          <button class="sidebar-icon-btn" id="btnSidebarLaunchChrome" title="Launch Chrome & Debug (CDP Port 9222)" style="color:var(--brand-forest);">
            <span style="font-size:1.15rem; line-height:1;">🚀</span>
          </button>
          <button class="sidebar-icon-btn" title="Reload Dashboard" onclick="location.reload()">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
            </svg>
          </button>
          <button class="sidebar-icon-btn" id="btnLogout" title="Logout" style="color:var(--text-tertiary); margin-top:0.5rem;">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
            </svg>
          </button>
        </div>
      </aside>
      <!-- END: Floating Left Sidebar -->

      <!-- Dynamic SPA View Mount Point -->
      <section class="app-view-container" id="appViewContainer">
        <!-- Tab views render dynamically here -->
      </section>

    </div>
    <!-- END: Main Body Layout -->

  </main>
  <!-- END: Main Dashboard Container -->

  <!-- BEGIN: Step Inspector Modal -->
  <div class="modal-overlay hidden" id="stepInspectorModal">
    <div class="modal-dialog">
      <div class="modal-header">
        <div style="display:flex; align-items:center; gap:0.5rem;">
          <span style="font-size:1.2rem;">🔍</span>
          <h3 id="modalWorkflowTitle">Workflow Step Inspector</h3>
        </div>
        <button class="btn-icon" id="btnCloseModal">✕</button>
      </div>
      <div class="modal-body">
        <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:0.75rem; background:#f9fafb; padding:0.85rem; border-radius:var(--radius-md); border:1px solid rgba(0,0,0,0.06);" id="modalMetaGrid"></div>
        <h4 style="font-size:0.85rem; font-weight:800; margin-top:0.5rem;">Recorded Action Fingerprints</h4>
        <div style="display:flex; flex-direction:column; gap:0.75rem;" id="modalStepsTimeline"></div>
      </div>
    </div>
  </div>
  <!-- END: Step Inspector Modal -->

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- BEGIN: Auth Overlay (hidden if authenticated) -->
  <div class="modal-overlay" id="authOverlay" style="background:#ffffff; z-index: 10000; align-items: center;">
    <div style="background: white; padding: 2.5rem; border-radius: var(--radius-lg); border: 1px solid var(--border-light); box-shadow: 0 10px 30px rgba(0,0,0,0.05); width: 100%; max-width: 400px;">
      <div style="text-align:center; margin-bottom: 2rem;">
        <span style="font-size:2.5rem; display:block; margin-bottom:1rem;">⚡</span>
        <h2 style="font-size:1.5rem; margin-bottom:0.5rem; color:var(--text-primary);">Workflow Capture</h2>
        <p style="color:var(--text-secondary); font-size:0.9rem;" id="authSubtitle">Log in to your account</p>
      </div>
      
      <form id="authForm" style="display:flex; flex-direction:column; gap:1.25rem;">
        <div id="usernameGroup" style="display:none; flex-direction:column; gap:0.5rem;">
          <label style="font-size:0.85rem; font-weight:600; color:var(--text-secondary);">Username</label>
          <input type="text" id="authUsername" placeholder="e.g. jdoe" style="padding:0.75rem; border:1px solid var(--border-light); border-radius:var(--radius-sm); outline:none; font-family:inherit;">
        </div>
        <div style="display:flex; flex-direction:column; gap:0.5rem;">
          <label style="font-size:0.85rem; font-weight:600; color:var(--text-secondary);">Email</label>
          <input type="email" id="authEmail" placeholder="name@example.com" style="padding:0.75rem; border:1px solid var(--border-light); border-radius:var(--radius-sm); outline:none; font-family:inherit;">
        </div>
        <div style="display:flex; flex-direction:column; gap:0.5rem;">
          <label style="font-size:0.85rem; font-weight:600; color:var(--text-secondary);">Password</label>
          <input type="password" id="authPassword" placeholder="••••••••" style="padding:0.75rem; border:1px solid var(--border-light); border-radius:var(--radius-sm); outline:none; font-family:inherit;">
        </div>
        <button type="submit" style="background:var(--brand-accent); color:white; border:none; border-radius:var(--radius-md); padding:0.85rem; font-weight:600; cursor:pointer; margin-top:0.5rem; transition: background 0.2s;" onmouseover="this.style.background='var(--brand-accent-hover)'" onmouseout="this.style.background='var(--brand-accent)'" id="authSubmitBtn">Log In</button>
        <button type="button" id="btnDummyLogin" onclick="window.quickEnterDashboard ? window.quickEnterDashboard() : null" style="background:#0c5c3f; color:#ffffff; border:none; border-radius:var(--radius-md); padding:0.85rem; font-weight:700; cursor:pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 0.5rem; box-shadow: 0 4px 12px rgba(12, 92, 63, 0.2);" onmouseover="this.style.background='#08442e'" onmouseout="this.style.background='#0c5c3f'">
          <span>⚡ Enter Dashboard (Skip Login)</span>
        </button>
      </form>
      
      <div style="text-align:center; margin-top:1.5rem; font-size:0.85rem; color:var(--text-secondary);">
        <span id="authToggleText">Don't have an account? </span>
        <a href="#" id="authToggleMode" style="color:var(--brand-accent); font-weight:600; text-decoration:none;">Sign up</a>
      </div>
    </div>
  </div>
  <!-- END: Auth Overlay -->

  <!-- Main ES Module Initializer -->
  <script type="module" src="/js/main.js"></script>
</body>
</html>
